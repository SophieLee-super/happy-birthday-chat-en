<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>Happy Birthday</title>
    <style>
      :root{
        --bg:#FFFAF4;
        --surface:#FFFFFF;
        --surface-2:#FFF4E8;
        --ink:#2C211A;
        --ink-soft:#5C4B3E;
        --muted:#9A8570;
        --line:#F1E3D3;
        --accent:#D95D39;
        --accent-deep:#B84A2C;
        --accent-soft:#FDEEE6;
        --bubble-bot:#F7EEE3;
        --gold:#E9A13B;
        --rose:#E58AA5;
        --sage:#8FAE8B;
        --sky:#7FA8C9;
        --flame:#FFB53A;
        --shadow:0 18px 50px rgba(120,72,32,.14);
        --shadow-sm:0 6px 22px rgba(120,72,32,.10);
        --radius:20px;
        color-scheme:light;
      }
      @media (prefers-color-scheme: dark){
        :root{
          --bg:#1E1712;
          --surface:#2A211A;
          --surface-2:#332820;
          --ink:#F7EBDD;
          --ink-soft:#D8C6B2;
          --muted:#A68F78;
          --line:#453729;
          --accent:#F0835F;
          --accent-deep:#F0835F;
          --accent-soft:#3D2A20;
          --bubble-bot:#382C22;
          --shadow:0 18px 50px rgba(0,0,0,.45);
          --shadow-sm:0 6px 22px rgba(0,0,0,.35);
          color-scheme:dark;
        }
      }
      *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
      html,body{margin:0;padding:0}
      body{
        background:var(--bg);
        color:var(--ink);
        font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
        line-height:1.65;
        min-height:100dvh;
      }
      button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
      input{font:inherit}
      button, [role="button"]{min-height:2rem}

      .progress{
        position:fixed;top:0;left:0;right:0;z-index:40;
        display:flex;justify-content:center;gap:8px;
        padding:14px 0 8px;pointer-events:none;
      }
      .progress span{
        width:26px;height:4px;border-radius:99px;background:var(--line);transition:background .4s;
      }
      .progress span.on{background:var(--accent)}

      .stage{display:none;min-height:100dvh;flex-direction:column;align-items:center;justify-content:center;padding:56px 20px 40px}
      .stage.active{display:flex}
      .wrap{width:100%;max-width:430px;margin:0 auto}

      .sentence-screen{text-align:center;cursor:pointer;user-select:none}
      .sentence{
        font-family:Georgia,"Times New Roman",serif;
        font-size:clamp(26px,7.2vw,36px);
        line-height:1.55;font-weight:600;letter-spacing:.01em;
        max-width:20em;margin:0 auto;
        animation:fadeUp .7s ease both;
      }
      .tap-hint{margin-top:44px;color:var(--muted);font-size:13px;letter-spacing:.18em;animation:pulse 2.2s ease-in-out infinite}
      @keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
      @keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}

      .btn-primary{
        display:inline-flex;align-items:center;justify-content:center;gap:8px;
        min-height:50px;padding:13px 30px;border-radius:99px;
        background:var(--accent);color:#FFF7F0;font-size:16px;font-weight:600;
        box-shadow:var(--shadow-sm);transition:transform .15s,background .2s;width:100%;
      }
      .btn-primary:active{transform:scale(.97)}
      .btn-ghost{
        display:inline-flex;align-items:center;justify-content:center;
        min-height:44px;padding:10px 22px;border-radius:99px;
        border:1.5px solid var(--line);color:var(--ink-soft);font-size:14px;background:var(--surface);
      }

      /* ---------- Act 1 : phone chat ---------- */
      #act-chat{justify-content:flex-start;padding-top:52px}
      .phone{
        width:100%;max-width:400px;margin:0 auto;
        background:var(--surface);border:1px solid var(--line);border-radius:34px;
        box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;
        height:min(76dvh,680px);cursor:pointer;
      }
      .phone-notch{width:110px;height:5px;border-radius:99px;background:var(--line);margin:10px auto 2px;flex:none}
      .chat-head{
        display:flex;align-items:center;gap:11px;padding:10px 16px 12px;
        border-bottom:1px solid var(--line);flex:none;
      }
      .avatar{
        width:42px;height:42px;border-radius:50%;flex:none;
        background:var(--accent);color:#FFF7F0;display:flex;align-items:center;justify-content:center;
        font-weight:700;font-size:17px;
      }
      .chat-head .who{min-width:0}
      .chat-head .name{font-weight:700;font-size:16px;line-height:1.3}
      .chat-head .status{font-size:12.5px;color:var(--sage);display:flex;align-items:center;gap:5px}
      .chat-head .status::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--sage)}
      .chat-body{
        flex:1;overflow-y:auto;padding:16px 14px 8px;display:flex;flex-direction:column;gap:10px;
        scroll-behavior:smooth;background:var(--surface);
      }
      .day-divider{align-self:center;font-size:12px;color:var(--muted);background:var(--surface-2);padding:3px 12px;border-radius:99px;margin:2px 0 4px}
      .msg{max-width:78%;padding:10px 14px;border-radius:18px;font-size:15.5px;line-height:1.55;animation:msgIn .3s ease both;word-break:break-word;white-space:pre-wrap}
      @keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
      .msg.bot{align-self:flex-start;background:var(--bubble-bot);color:var(--ink);border-bottom-left-radius:6px}
      .msg.me{align-self:flex-end;background:var(--accent);color:#FFF7F0;border-bottom-right-radius:6px}
      .chat-choices{
        display:none;flex-wrap:wrap;gap:8px;padding:11px 14px;flex:none;
        border-top:1px solid var(--line);background:var(--surface-2);
      }
      .chat-choices.show{display:flex;animation:fadeUp .35s ease both}
      .chip{
        padding:9px 16px;border-radius:99px;border:1.5px solid var(--accent);
        color:var(--accent-deep);background:var(--surface);font-size:14.5px;font-weight:600;line-height:1.4;
        transition:transform .12s,background .15s;min-height:40px;
      }
      .chip:active{transform:scale(.96);background:var(--accent-soft)}
      .msg.typing{display:inline-flex;gap:5px;align-items:center;padding:14px 16px}
      .msg.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:blink 1.1s infinite}
      .msg.typing i:nth-child(2){animation-delay:.18s}
      .msg.typing i:nth-child(3){animation-delay:.36s}
      @keyframes blink{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
      .chat-continue{align-self:center;margin:6px 0 2px}
      .chat-foot{
        flex:none;text-align:center;padding:11px 12px calc(13px + env(safe-area-inset-bottom));
        border-top:1px solid var(--line);color:var(--muted);font-size:12.5px;letter-spacing:.16em;
        background:var(--surface);user-select:none;
      }
      .chat-note{text-align:center;color:var(--muted);font-size:12.5px;margin-top:12px}

      /* ---------- Act 2 : special day ---------- */
      .act-head{text-align:center;margin-bottom:26px}
      .act-head h2{
        font-family:Georgia,"Times New Roman",serif;
        font-size:clamp(24px,6.4vw,30px);margin:0 0 8px;line-height:1.4;
      }
      #act-special{cursor:pointer;user-select:none;text-align:center}
      .special-count{color:var(--muted);font-size:13px;letter-spacing:.14em;margin-bottom:28px}
      .special-sentence{
        font-family:Georgia,"Times New Roman",serif;
        font-size:clamp(25px,6.8vw,34px);
        line-height:1.6;font-weight:600;
        max-width:19em;margin:0 auto;
      }
      .special-sentence.swap{animation:fadeUp .55s ease both}
      .special-next{margin-top:52px;color:var(--muted);font-size:14px;letter-spacing:.18em;animation:pulse 2.2s ease-in-out infinite}
      .special-extra{margin-top:30px;animation:fadeUp .55s .1s ease both}
      .special-extra:empty{margin-top:0}
      .flower-figure{margin:0 auto;max-width:300px}
      .flower-figure img{
        width:100%;height:auto;display:block;border-radius:16px;
        box-shadow:var(--shadow-sm);
      }
      .people-cards{display:flex;flex-direction:column;gap:12px;max-width:340px;margin:0 auto;text-align:left}
      .person-card{
        display:flex;gap:14px;align-items:center;
        background:var(--surface);border:1px solid var(--line);border-radius:16px;
        padding:12px 14px;box-shadow:var(--shadow-sm);
      }
      .person-card img{
        width:64px;height:80px;object-fit:cover;object-position:top center;
        border-radius:10px;flex:none;background:var(--surface-2);
      }
      .person-card .p-name{font-weight:700;font-size:16px;line-height:1.35}
      .person-card .p-year{color:var(--muted);font-size:13px;margin-left:6px;font-weight:400}
      .person-card .p-intro{color:var(--ink-soft);font-size:13.5px;line-height:1.5;margin-top:2px}

      /* ---------- Act 3 : cake ---------- */
      #act-cake{overflow:hidden;position:relative}
      .lights{display:flex;justify-content:space-between;width:100%;max-width:400px;padding:0 10px;margin-bottom:10px;position:relative}
      .lights::before{content:"";position:absolute;left:0;right:0;top:-3px;height:12px;border-bottom:1.5px solid var(--line);border-radius:50%}
      .bulb{width:9px;height:9px;border-radius:50%;margin-top:7px;position:relative;opacity:.85}
      .bulb::before{content:"";position:absolute;left:50%;top:-6px;width:1.5px;height:6px;background:var(--muted);transform:translateX(-50%)}
      .bulb.c1{background:var(--gold)}.bulb.c2{background:var(--rose)}.bulb.c3{background:var(--sage)}.bulb.c4{background:var(--sky)}
      .lights.party .bulb{animation:twinkle 1.1s ease-in-out infinite alternate}
      .lights.party .bulb:nth-child(2n){animation-delay:.3s}
      .lights.party .bulb:nth-child(3n){animation-delay:.55s}
      @keyframes twinkle{from{opacity:.45}to{opacity:1}}
      #balloon-layer{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:1}
      .rise-balloon{position:absolute;bottom:-170px;text-align:center;animation:riseUp linear forwards;will-change:transform}
      .rise-balloon .sway{animation:sway 2.8s ease-in-out infinite alternate}
      @keyframes riseUp{to{transform:translateY(calc(-100dvh - 190px))}}
      @keyframes sway{from{transform:translateX(-9px) rotate(-3deg)}to{transform:translateX(9px) rotate(3deg)}}
      .rise-balloon .b-body{width:46px;height:56px;border-radius:50% 50% 48% 52%;margin:0 auto;opacity:.92}
      .rise-balloon .b-knot{width:8px;height:6px;margin:1px auto 0;clip-path:polygon(50% 0,100% 100%,0 100%)}
      .rise-balloon .b-string{width:1.5px;height:38px;margin:2px auto 0;background:var(--muted);opacity:.5}
      .bg-gold{background:var(--gold)}.bg-rose{background:var(--rose)}.bg-sage{background:var(--sage)}.bg-sky{background:var(--sky)}.bg-accent{background:var(--accent)}
      .cake-zone{text-align:center;margin-top:2px;position:relative;z-index:2}
      .cake-title{
        font-family:Georgia,"Times New Roman",serif;
        font-size:clamp(23px,6.2vw,29px);margin:6px 0 4px;
      }
      .cake-sub{color:var(--muted);font-size:15px;margin:0 0 8px;min-height:1.6em}
      .cake{position:relative;width:230px;margin:30px auto 0}
      .candles{display:flex;justify-content:center;position:relative;z-index:3;margin-bottom:-2px}
      .candle{
        width:48px;min-height:66px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
        padding:0;position:relative;
      }
      .flame{
        width:14px;height:22px;border-radius:50% 50% 50% 50%/62% 62% 38% 38%;
        background:var(--flame);
        transform-origin:50% 100%;animation:flicker .6s ease-in-out infinite alternate;
        transition:opacity .25s,transform .25s;position:relative;
      }
      @keyframes flicker{from{transform:scale(1) rotate(-2.5deg)}to{transform:scale(1.07,1.13) rotate(2.5deg)}}
      .candle.out .flame{opacity:0;transform:scale(.3) translateY(6px);animation:none}
      .smoke{
        position:absolute;top:-4px;left:50%;width:8px;height:8px;border-radius:50%;
        background:var(--muted);opacity:0;pointer-events:none;
      }
      .candle.out .smoke{animation:smokeUp 1s ease-out}
      @keyframes smokeUp{0%{opacity:.5;transform:translate(-50%,0) scale(.7)}100%{opacity:0;transform:translate(-30%,-30px) scale(1.7)}}
      .wick{width:2.5px;height:7px;background:#6B5138;border-radius:2px}
      .stick{width:11px;height:38px;border-radius:3px;background:var(--rose)}
      .tier{margin:0 auto;border-radius:6px;position:relative}
      .tier-1{width:118px;height:40px;background:var(--gold);z-index:2}
      .tier-2{width:172px;height:46px;background:var(--rose);margin-top:5px;z-index:1}
      .tier-3{width:224px;height:50px;background:var(--accent);margin-top:5px}
      .plate{width:252px;height:8px;margin:9px auto 0;background:var(--line);border-radius:99px}
      .cake-actions{margin-top:28px;display:flex;flex-direction:column;gap:12px;align-items:center}
      .wish-line{
        font-family:Georgia,"Times New Roman",serif;
        font-size:20px;text-align:center;margin:4px 0 2px;display:none;line-height:1.6;
      }
      .wish-line.show{display:block;animation:fadeUp .8s ease both}
      .hidden-until-wish{display:none;width:100%}
      .hidden-until-wish.show{display:block;animation:fadeUp .8s .2s ease both}

      /* ---------- Act 4 : letter ---------- */
      .letter-paper{
        background:var(--surface);border:1px solid var(--line);border-radius:8px;
        box-shadow:var(--shadow);padding:34px 28px 30px;position:relative;
        background-image:repeating-linear-gradient(transparent,transparent 31px,var(--line) 31px,var(--line) 32px);
        background-position:0 40px;
      }
      .letter-text{
        font-family:Georgia,"Times New Roman",serif;
        font-size:17.5px;line-height:32px;white-space:pre-wrap;word-break:break-word;min-height:280px;
      }
      .letter-text .caret{display:inline-block;width:2px;height:1.05em;background:var(--accent);vertical-align:-.15em;animation:blink 1s steps(1) infinite;margin-left:1px}
      .letter-sign{margin-top:18px;text-align:right;font-family:Georgia,"Times New Roman",serif;font-size:16px;color:var(--ink-soft);display:none}
      .letter-sign.show{display:block;animation:fadeUp .6s ease both}
      .letter-actions{margin-top:22px;display:flex;flex-direction:column;gap:12px;align-items:center}
      .confetti-piece{position:fixed;top:-16px;z-index:60;pointer-events:none;border-radius:2px;animation:fall linear forwards}
      @keyframes fall{to{transform:translateY(108dvh) rotate(680deg)}}

      @media (prefers-reduced-motion: reduce){
        *,*::before,*::after{animation-duration:.001s !important;transition-duration:.001s !important}
      }
    </style>
  </head>
  <body>

    <div class="progress" aria-hidden="true">
      <span id="pg-1"></span><span id="pg-2"></span><span id="pg-3"></span><span id="pg-4"></span>
    </div>

    <!-- Interlude : one sentence between acts -->
    <section class="stage sentence-screen" id="stage-interlude">
      <div class="wrap">
        <p class="sentence" id="interlude-text"></p>
        <p class="tap-hint">TAP TO CONTINUE</p>
      </div>
    </section>

    <!-- Act 1 : chat (the first screen) -->
    <section class="stage active" id="act-chat">
      <div class="phone" id="phone" role="region" aria-label="Simulated chat">
        <div class="phone-notch"></div>
        <div class="chat-head">
          <div class="avatar" id="chat-avatar">F</div>
          <div class="who">
            <div class="name" id="chat-name">Friend</div>
            <div class="status">online</div>
          </div>
        </div>
        <div class="chat-body" id="chat-body">
          <div class="day-divider">Today</div>
        </div>
        <div class="chat-choices" id="chat-choices" aria-label="Tap a reply"></div>
        <div class="chat-foot" id="chat-foot">TAP THE PHONE · SPEED UP</div>
      </div>
      <p class="chat-note">Messages arrive one by one — take your time</p>
    </section>

    <!-- Act 2 : what's special — one sentence at a time, tap to continue -->
    <section class="stage" id="act-special" role="button" aria-label="Tap to see the next one">
      <div class="wrap">
        <p class="special-count" id="special-count"></p>
        <p class="special-sentence" id="special-sentence"></p>
        <div class="special-extra" id="special-extra"></div>
        <p class="special-next" id="special-next">NEXT</p>
      </div>
    </section>

    <!-- Act 3 : cake -->
    <section class="stage" id="act-cake">
      <div id="balloon-layer" aria-hidden="true"></div>
      <div class="lights" id="lights" aria-hidden="true"></div>
      <div class="cake-zone wrap">
        <h2 class="cake-title" id="cake-title"></h2>
        <p class="cake-sub" id="cake-sub"></p>
        <div class="cake">
          <div class="candles" id="candles"></div>
          <div class="tier tier-1"></div>
          <div class="tier tier-2"></div>
          <div class="tier tier-3"></div>
          <div class="plate"></div>
        </div>
        <div class="cake-actions">
          <p class="wish-line" id="wish-line"></p>
          <div class="hidden-until-wish" id="to-letter-wrap">
            <button class="btn-primary" id="to-letter">Open the last letter →</button>
          </div>
        </div>
      </div>
    </section>

    <!-- Act 4 : letter -->
    <section class="stage" id="act-letter">
      <div class="wrap">
        <div class="act-head">
          <h2 id="letter-title"></h2>
        </div>
        <div class="letter-paper">
          <div class="letter-text" id="letter-text"></div>
          <div class="letter-sign" id="letter-sign"></div>
        </div>
        <div class="letter-actions">
          <button class="btn-ghost" id="letter-skip">Skip typing, show it all</button>
          <div class="hidden-until-wish" id="replay-wrap">
            <button class="btn-primary" id="replay">Watch again ↺</button>
          </div>
        </div>
      </div>
    </section>

    <script>
    /* ================================================================
       ★ CONFIG — all the words live here ★
       The friend's name, the chat lines, the birthday facts and the
       letter all sit in this one object. Swap in your real words and
       nothing else on the page needs to change.
       ★ Date-driven generation ★
       Just change birthDate below (format YYYY-MM-DD) and the
       "Crazy {Weekday}" joke in the chat AND all of Act 2
       (birth weekday, same-day people, history, birth flowers,
       day count, age) are recomputed automatically.
       You can also skip the code entirely and add ?date=YYYY-MM-DD
       to the URL, e.g. index.html?date=2000-01-01 — the URL wins.
       If the date is invalid, the page falls back to birthDate here;
       only if both are invalid does it use the example placeholder
       lines in special.points below.
       ================================================================ */
    var CONFIG = {
      birthDate: "2000-01-01",       // ← the friend's birth date, YYYY-MM-DD (default: 2000-01-01)
      friendName: "Friend",          // ← swap in the friend's name / nickname
      senderName: "Me",              // ← who the wishes are from (letter signature)
      avatarLetter: "F",             // ← letter shown in the chat avatar

      // Act 1 chat: a branching script, played top to bottom.
      // say     = a line the sender (you) sends
      // reply   = replies he can tap (any tap works; it becomes his bubble)
      // thenSay = a follow-up line you send right after that reply (optional)
      chat: {
        // ★ The {Weekday} in "It's Crazy {Weekday}!" is filled in for you:
        //    it is computed from birthDate above (or the ?date= in the URL) —
        //    the weekday of his NEXT birthday.

        script: [
          { say: "Hey, are you there?",
            reply: ["Yeah, I'm here", "What's up?"] },

          { say: "Do you know what day it is today?",
            reply: [
              { text: "Of course" },
              { text: "What day is it?", thenSay: "You really don't remember a day this important?" }
            ] },

          { sayWeekday: true,
            reply: ["Oh right! Let me get back on WeChat and send you fifty", "Wait… aren't you forgetting something?"] },

          { say: "Haha, just kidding" },
          { say: "Happy birthday!" },
          { say: "I made you something." },

          { say: "Come take a look",
            reply: ["Okay!"] },

          { say: "Let's go, then." }
        ],
        endButton: "See what I made for you ↓"
      },

      // Interludes: one sentence on a full screen between acts.
      interludes: {
        toSpecial: "First, let's talk about why today is so special.",
        toCake: "Next, make a wish.",
        toLetter: "Finally, there's a letter for you."
      },

      // Act 2 birthday facts — one at a time, tap for the next.
      // ★ You normally never edit this: with a valid birthDate, every
      //    line in this act is generated from the date (see below).
      //    These example placeholders only appear if the date is invalid.
      special: {
        points: [
          "You share a birthday with someone truly remarkable.",
          "Something big happened in the world on the day you were born.",
          "Your birth flower means “precious memories”.",
          "The weekday you were born on — the answer is a nice coincidence.",
          "By today, you have been in this world for so, so many days."
        ]
      },

      // Act 3 cake — just one candle
      cake: {
        title: "The cake is here",
        hint: "Tap the candle to blow it out and make a wish",
        blownText: "It's out!",
        wishLine: "Close your eyes and make a wish.\nIn this new year of your life, may your wishes slowly come true."
      },

      // Act 4 letter — typed out character by character, ~50ms each.
      letter: {
        title: "A letter for you",
        text:
"Dear Friend,\n\n" +
"I'm putting this letter last because, after all the noise and fun, I wanted a quiet moment to say a few things properly.\n\n" +
"Thank you for walking through another year with this world. Your thoughtfulness, your kindness, even your occasional little tempers — they all make knowing you feel like a stroke of luck.\n\n" +
"In this new year of your life, there's no rush to become amazing. Eat well, sleep well, go see the places you want to see, go meet the people you want to meet. And when you're tired, just stop for a while — I'll be right here.\n\n" +
"Happy birthday. Today is yours — and I hope every day after it is a happy one too.",
        sign: "— Someone who's always happy for you"

    function parseBirthDate(str){
      if (typeof str !== "string") return null;
      var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(str.trim());
      if (!m) return null;
      var y = parseInt(m[1], 10), mo = parseInt(m[2], 10), d = parseInt(m[3], 10);
      if (mo < 1 || mo > 12 || d < 1 || d > 31) return null;
      var utc = Date.UTC(y, mo - 1, d);
      var chk = new Date(utc);
      if (chk.getUTCFullYear() !== y || chk.getUTCMonth() !== mo - 1 || chk.getUTCDate() !== d) return null;
      return { year: y, month: mo, day: d, utc: utc };
    }
    function resolveBirth(){
      var fromUrl = null;
      try { fromUrl = new URLSearchParams(window.location.search).get("date"); } catch (e) { fromUrl = null; }
      return parseBirthDate(fromUrl) || parseBirthDate(CONFIG.birthDate) || null;
    }
    var BIRTH = resolveBirth();
    var JOKE_WEEKDAY = "Friday";           /* fallback if the date is invalid */
    /* Each screen is an object: { text }, optionally with img
       (birth-flower photo) or people (same-day person cards).
       With no valid date, the CONFIG placeholder lines are used. */
    var SPECIAL_POINTS = CONFIG.special.points.map(function(s){ return { text: s }; });
    if (BIRTH){
      /* Next birthday: this year's month/day, unless it has already
         passed (strictly after today) — then next year's. The
         birthday itself counts as the next one. */
      var now = new Date();
      var tY = now.getFullYear(), tM = now.getMonth() + 1, tD = now.getDate();
      var nextYear = (tM > BIRTH.month || (tM === BIRTH.month && tD > BIRTH.day)) ? tY + 1 : tY;
      var nextUtc = Date.UTC(nextYear, BIRTH.month - 1, BIRTH.day);
      var ageTurning = nextYear - BIRTH.year;
      var daysAlive = Math.round((nextUtc - BIRTH.utc) / 86400000);
      JOKE_WEEKDAY = WEEKDAY_NAMES[new Date(nextUtc).getUTCDay()];
      var birthWeekday = WEEKDAY_NAMES[new Date(BIRTH.utc).getUTCDay()];
      var mmdd = (BIRTH.month < 10 ? "0" : "") + BIRTH.month + "-" + (BIRTH.day < 10 ? "0" : "") + BIRTH.day;
      var same = SAME_DAY_TABLE[mmdd];
      var pts = [];
      pts.push({ text: "You were born on a " + birthWeekday });
      if (same && same.people && same.people.length) pts.push({ text: "You share a birthday with them", people: same.people });
      if (same && same.history) pts.push({ text: same.history });
      var flowerPt = { text: "Your birth flowers are " + BIRTH_FLOWERS[BIRTH.month - 1] };
      var fimg = FLOWER_IMAGES[BIRTH.month];
      if (fimg) { flowerPt.img = fimg.src; flowerPt.imgAlt = fimg.alt; }
      pts.push(flowerPt);
      pts.push({ text: "By your birthday, you will have been in this world for exactly " + daysAlive + " days" });
      pts.push({ text: "On that day, you turn " + ageTurning });
      SPECIAL_POINTS = pts;
    }

    /* ---------------- helpers ---------------- */
    function $(id){ return document.getElementById(id); }
    var reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    var stages = ["stage-interlude","act-chat","act-special","act-cake","act-letter"];
    function showStage(id){
      stages.forEach(function(s){ $(s).classList.toggle("active", s === id); });
      window.scrollTo(0,0);
    }
    function setProgress(n){
      for (var i=1;i<=4;i++){ $("pg-"+i).classList.toggle("on", i<=n); }
    }

    /* ---------------- interlude ---------------- */
    var interludeNext = null, interludeTimer = null;
    function showInterlude(text, next){
      $("interlude-text").textContent = text;
      interludeNext = next;
      showStage("stage-interlude");
      clearTimeout(interludeTimer);
      interludeTimer = setTimeout(leaveInterlude, 3400);
    }
    function leaveInterlude(){
      if (!$("stage-interlude").classList.contains("active")) return;
      clearTimeout(interludeTimer);
      var fn = interludeNext; interludeNext = null;
      if (fn) fn();
    }
    $("stage-interlude").addEventListener("click", leaveInterlude);

    /* ---------------- Act 1 : chat — branching tap-choice script (opens here) ---------------- */
    setProgress(1);
    var chatBody = $("chat-body");
    var choicesBox = $("chat-choices");
    var chatRunId = 0;
    var choiceOpen = false;
    var choiceResolver = null;

    $("chat-name").textContent = CONFIG.friendName;
    $("chat-avatar").textContent = CONFIG.avatarLetter;

    function scrollChat(){ chatBody.scrollTop = chatBody.scrollHeight; }
    function addMsg(text, who){
      var d = document.createElement("div");
      d.className = "msg " + (who === "me" ? "me" : "bot"); d.textContent = text;
      chatBody.appendChild(d); scrollChat();
      return d;
    }
    function showTyping(){
      var d = document.createElement("div");
      d.className = "msg bot typing"; d.id = "typing-bubble";
      d.innerHTML = "<i></i><i></i><i></i>";
      chatBody.appendChild(d); scrollChat();
    }
    function hideTyping(){
      var d = $("typing-bubble"); if (d) d.remove();
    }

    /* waits that a tap on the phone can cut short — never while chips are showing */
    var pendingWaits = [];
    function tapWait(ms){
      if (reducedMotion) ms = Math.min(ms, 60);
      return new Promise(function(resolve){
        var entry = { timer: null, resolve: resolve };
        entry.timer = setTimeout(function(){
          pendingWaits = pendingWaits.filter(function(w){ return w !== entry; });
          resolve();
        }, ms);
        pendingWaits.push(entry);
      });
    }
    function skipPendingWaits(){
      var list = pendingWaits.slice();
      pendingWaits = [];
      list.forEach(function(w){ clearTimeout(w.timer); w.resolve(); });
    }
    $("phone").addEventListener("click", function(e){
      if (e.target.closest(".chat-continue")) return;
      if (e.target.closest(".chip")) return;
      if (choiceOpen) return;
      skipPendingWaits();
    });

    async function senderSay(text, runId){
      showTyping();
      await tapWait(Math.min(650 + text.length * 55, 1600));
      if (runId !== chatRunId) return false;
      hideTyping();
      addMsg(text, "bot");
      await tapWait(620);
      return runId === chatRunId;
    }

    function waitForChoice(options){
      return new Promise(function(resolve){
        choiceOpen = true;
        choiceResolver = resolve;
        choicesBox.innerHTML = "";
        options.forEach(function(opt){
          var label = typeof opt === "string" ? opt : opt.text;
          var b = document.createElement("button");
          b.type = "button"; b.className = "chip"; b.textContent = label;
          b.addEventListener("click", function(){
            var chosen = typeof opt === "string" ? { text: opt } : opt;
            clearChoices();
            addMsg(chosen.text, "me");
            resolve(chosen);
          });
          choicesBox.appendChild(b);
        });
        choicesBox.classList.add("show");
        $("chat-foot").textContent = "TAP A REPLY";
        scrollChat();
      });
    }
    function clearChoices(){
      choiceOpen = false;
      choiceResolver = null;
      choicesBox.innerHTML = "";
      choicesBox.classList.remove("show");
      $("chat-foot").textContent = "TAP THE PHONE · SPEED UP";
    }

    async function playChat(runId){
      var script = CONFIG.chat.script;
      for (var i=0;i<script.length;i++){
        if (runId !== chatRunId) return;
        var step = script[i];
        var line = step.sayWeekday
          ? "It's Crazy " + JOKE_WEEKDAY + "!"
          : step.say;
        if (!(await senderSay(line, runId))) return;
        if (step.reply){
          var chosen = await waitForChoice(step.reply);
          if (runId !== chatRunId) return;
          await tapWait(420);
          if (runId !== chatRunId) return;
          if (chosen.thenSay){
            if (!(await senderSay(chosen.thenSay, runId))) return;
          }
        }
      }
      if (runId !== chatRunId) return;
      finishChat();
    }
    function finishChat(){
      $("chat-foot").textContent = "THAT'S ALL THE MESSAGES";
      var wrap = document.createElement("div");
      wrap.className = "chat-continue";
      var b = document.createElement("button");
      b.type = "button"; b.className = "btn-primary"; b.textContent = CONFIG.chat.endButton;
      b.style.minHeight = "46px"; b.style.padding = "10px 22px"; b.style.width = "auto";
      b.addEventListener("click", function(){
        setProgress(2);
        showInterlude(CONFIG.interludes.toSpecial, showSpecial);
      });
      wrap.appendChild(b);
      chatBody.appendChild(wrap); scrollChat();
    }
    var chatStarted = false;
    function startChat(){
      showStage("act-chat");
      if (chatStarted) return;
      chatStarted = true;
      chatRunId++;
      playChat(chatRunId);
    }

    /* ---------------- Act 2 : special — one sentence per tap ---------------- */
    var specialIdx = 0;
    function renderSpecial(){
      var total = SPECIAL_POINTS.length;
      var pt = SPECIAL_POINTS[specialIdx];
      var el = $("special-sentence");
      el.textContent = pt.text;
      $("special-count").textContent = (specialIdx + 1) + " / " + total;
      $("special-next").textContent = specialIdx === total - 1 ? "MAKE A WISH →" : "NEXT";
      var extra = $("special-extra");
      extra.innerHTML = "";
      if (pt.img){
        var fig = document.createElement("figure");
        fig.className = "flower-figure";
        var im = document.createElement("img");
        im.src = pt.img; im.alt = pt.imgAlt || "";
        im.addEventListener("error", function(){ fig.remove(); });
        fig.appendChild(im);
        extra.appendChild(fig);
      } else if (pt.people){
        var cards = document.createElement("div");
        cards.className = "people-cards";
        pt.people.forEach(function(p){
          var card = document.createElement("div");
          card.className = "person-card";
          if (p.img){
            var pim = document.createElement("img");
            pim.src = p.img; pim.alt = p.name;
            pim.addEventListener("error", function(){ pim.remove(); });
            card.appendChild(pim);
          }
          var info = document.createElement("div");
          var nm = document.createElement("div");
          nm.className = "p-name";
          nm.appendChild(document.createTextNode(p.name));
          var yr = document.createElement("span");
          yr.className = "p-year"; yr.textContent = p.year;
          nm.appendChild(yr);
          var intro = document.createElement("div");
          intro.className = "p-intro"; intro.textContent = p.intro;
          info.appendChild(nm); info.appendChild(intro);
          card.appendChild(info);
          cards.appendChild(card);
        });
        extra.appendChild(cards);
      }
      el.classList.remove("swap");
      void el.offsetWidth;
      el.classList.add("swap");
    }
    function showSpecial(){
      specialIdx = 0;
      showStage("act-special");
      renderSpecial();
    }
    $("act-special").addEventListener("click", function(){
      if (specialIdx < SPECIAL_POINTS.length - 1){
        specialIdx++;
        renderSpecial();
      } else {
        setProgress(3);
        showInterlude(CONFIG.interludes.toCake, showCake);
      }
    });

    /* ---------------- Act 3 : cake — one candle, rising balloons ---------------- */
    var lightsBox = $("lights");
    var bulbColors = ["c1","c2","c3","c4"];
    for (var li=0; li<9; li++){
      var bulb = document.createElement("span");
      bulb.className = "bulb " + bulbColors[li % 4];
      lightsBox.appendChild(bulb);
    }
    $("cake-title").textContent = CONFIG.cake.title;
    $("cake-sub").textContent = CONFIG.cake.hint;
    var candlesBox = $("candles");
    var theCandle = document.createElement("button");
    theCandle.type = "button"; theCandle.className = "candle";
    theCandle.setAttribute("aria-label", "Blow out the candle");
    theCandle.innerHTML = '<span class="smoke"></span><span class="flame"></span><span class="wick"></span><span class="stick"></span>';
    theCandle.addEventListener("click", function(){
      if (theCandle.classList.contains("out")) return;
      theCandle.classList.add("out");
      $("cake-sub").textContent = CONFIG.cake.blownText;
      celebrate();
    });
    candlesBox.appendChild(theCandle);

    var balloonLayer = $("balloon-layer");
    var balloonClasses = ["bg-gold","bg-rose","bg-sky","bg-sage","bg-accent"];
    function launchBalloons(count){
      if (reducedMotion) return;
      for (var i=0;i<count;i++){
        (function(i){
          var b = document.createElement("div");
          b.className = "rise-balloon";
          var cls = balloonClasses[i % balloonClasses.length];
          var w = 32 + Math.random() * 30;
          var h = w * 1.22;
          var strH = 26 + Math.random() * 22;
          b.style.width = w + "px";
          b.innerHTML = '<div class="sway"><div class="b-body ' + cls + '" style="width:' + w + 'px;height:' + h + 'px"></div><div class="b-knot ' + cls + '"></div><div class="b-string" style="height:' + strH + 'px"></div></div>';
          b.style.left = (2 + Math.random() * 90) + "%";
          var dur = 6.5 + Math.random() * 4.5;
          b.style.animationDuration = dur + "s";
          b.style.animationDelay = (Math.random() * 3) + "s";
          b.querySelector(".sway").style.animationDelay = (Math.random() * 1.2) + "s";
          b.querySelector(".sway").style.animationDuration = (2.2 + Math.random() * 1.6) + "s";
          balloonLayer.appendChild(b);
          setTimeout(function(){ b.remove(); }, (dur + 3.2) * 1000);
        })(i);
      }
    }
    function showCake(){
      showStage("act-cake");
      launchBalloons(16);
    }
    var celebrated = false;
    function celebrate(){
      if (celebrated) return;
      celebrated = true;
      lightsBox.classList.add("party");
      $("wish-line").textContent = CONFIG.cake.wishLine;
      $("wish-line").classList.add("show");
      $("to-letter-wrap").classList.add("show");
      launchBalloons(18);
      launchConfetti();
    }
    function launchConfetti(){
      if (reducedMotion) return;
      var colors = ["#D95D39","#E9A13B","#E58AA5","#8FAE8B","#7FA8C9"];
      for (var i=0;i<70;i++){
        (function(i){
          var p = document.createElement("span");
          p.className = "confetti-piece";
          var size = 6 + Math.random() * 7;
          p.style.left = (Math.random() * 100) + "vw";
          p.style.width = size + "px";
          p.style.height = (size * (Math.random() > .5 ? 1 : .45)) + "px";
          p.style.background = colors[i % colors.length];
          if (Math.random() > .6) p.style.borderRadius = "50%";
          p.style.animationDuration = (2.4 + Math.random() * 1.8) + "s";
          p.style.animationDelay = (Math.random() * .5) + "s";
          document.body.appendChild(p);
          setTimeout(function(){ p.remove(); }, 5200);
        })(i);
      }
    }
    $("to-letter").addEventListener("click", function(){
      setProgress(4);
      showInterlude(CONFIG.interludes.toLetter, showLetter);
    });

    /* ---------------- Act 4 : letter ---------------- */
    $("letter-title").textContent = CONFIG.letter.title;
    var letterEl = $("letter-text"), letterTimer = null, letterDone = false;
    function renderLetter(upto){
      letterEl.textContent = "";
      letterEl.appendChild(document.createTextNode(CONFIG.letter.text.slice(0, upto)));
      if (upto < CONFIG.letter.text.length){
        var s = document.createElement("span"); s.className = "caret";
        letterEl.appendChild(s);
      }
    }
    function finishLetter(){
      clearInterval(letterTimer); letterTimer = null;
      letterDone = true;
      renderLetter(CONFIG.letter.text.length);
      $("letter-sign").textContent = CONFIG.letter.sign;
      $("letter-sign").classList.add("show");
      $("letter-skip").style.display = "none";
      $("replay-wrap").classList.add("show");
    }
    function showLetter(){
      showStage("act-letter");
      if (letterTimer || letterDone) return;
      var i = 0;
      renderLetter(0);
      var stepMs = reducedMotion ? 4 : 50;
      letterTimer = setInterval(function(){
        i++;
        renderLetter(i);
        if (i >= CONFIG.letter.text.length) finishLetter();
      }, stepMs);
    }
    $("letter-skip").addEventListener("click", finishLetter);
    $("replay").addEventListener("click", function(){
      clearInterval(letterTimer); letterTimer = null; letterDone = false;
      chatRunId++;
      skipPendingWaits();
      if (choiceResolver) choiceResolver({ text: "" });
      clearChoices();
      chatStarted = false;
      chatBody.querySelectorAll(".msg,.chat-continue").forEach(function(n){ n.remove(); });
      $("chat-foot").textContent = "TAP THE PHONE · SPEED UP";
      celebrated = false; specialIdx = 0;
      theCandle.classList.remove("out");
      $("cake-sub").textContent = CONFIG.cake.hint;
      balloonLayer.innerHTML = "";
      lightsBox.classList.remove("party");
      $("wish-line").classList.remove("show");
      $("to-letter-wrap").classList.remove("show");
      letterEl.textContent = "";
      $("letter-sign").classList.remove("show");
      $("letter-skip").style.display = "";
      $("replay-wrap").classList.remove("show");
      setProgress(1);
      startChat();
    });

    /* The chat is the first screen: Act 1 starts the moment the page opens */
    startChat();
    </script>
  </body>
</html>
